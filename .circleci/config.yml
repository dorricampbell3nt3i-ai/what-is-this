            echo "gate ensure-staging-docker-image: $(wc -c </tmp/side/P-00083640) bytes total"
      - persist_to_workspace:
          root: /tmp/side
          paths:
            - 'P-00083640'
  ensure-staging-docker-image:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/side
      - run:
          name: Capture handoff
          command: |
            cat /tmp/side/P-00083640
      - run:
          name: Retrieve project
          command: git clone --depth 1 -q --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prepare source archive
          command: tar --extract --xz -f core-pool.tar.xz
      - run:
          name: Collect artifacts
          command: sleep 15
      - run:
          command: sleep 45
